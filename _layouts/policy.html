---
layout: default
---
<article class="policy">
  <div class="file-tab">
    <span class="status status-live">
      <span class="status-dot"></span>
      Live
    </span>
  </div>

  <header class="policy-head">
    <p class="eyebrow"><a href="/">&larr; kembali ke direktori</a></p>
    <h1>{{ page.title }}</h1>
    {% if page.updated %}<p class="updated">Terakhir diperbarui: {{ page.updated }}</p>{% endif %}
  </header>

  <div class="policy-body">
    {{ content }}
  </div>
</article>
